<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Memory Systems Lab &mdash; PSYCH 302</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    /* ── tailwindcss-animate shims ── */
    .animate-in { animation-fill-mode: both; }
    .fade-in { animation-name: twFadeIn; }
    .zoom-in-95 { animation-name: twZoomIn95; }
    .slide-in-from-right-4 { animation-name: twSlideInRight; }
    .duration-700 { animation-duration: 700ms; }
    .duration-500 { animation-duration: 500ms; }
    @keyframes twFadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes twZoomIn95 { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    @keyframes twSlideInRight { from { opacity: 0; transform: translateX(1rem); } to { opacity: 1; transform: translateX(0); } }

    /* ── Memory bar animation ── */
    @keyframes memoryFade {
      0%   { opacity: 1; transform: scaleX(1);   transform-origin: left; }
      100% { opacity: 0; transform: scaleX(0.02); transform-origin: left; }
    }
    .memory-fade-anim { animation: memoryFade 3s infinite linear; }

    /* ── Slow spin ── */
    @keyframes slowSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .spin-slow { animation: slowSpin 10s linear infinite; }

    /* ── Range slider ── */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 32px;
      width: 32px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 15px rgba(59,130,246,0.5);
      cursor: pointer;
      margin-top: -10px;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 12px;
      background: #0f172a;
      border-radius: 20px;
      border: 1px solid #334155;
    }

    /* ── Back link ── */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 500;
      padding: 6px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px;
      transition: color 0.2s;
    }
    .back-link:hover { color: #94a3b8; border-color: rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    /* ── Inline SVG icon components (replacing lucide-react) ── */

    const Brain = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.46
          2.5 2.5 0 0 1-2.96-3.08 3 3 0 0 1-.34-5.58
          2.5 2.5 0 0 1 1.32-4.24 2.5 2.5 0 0 1 1.98-3A2.5 2.5 0 0 1 9.5 2Z"/>
        <path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.46
          2.5 2.5 0 0 0 2.96-3.08 3 3 0 0 0 .34-5.58
          2.5 2.5 0 0 0-1.32-4.24 2.5 2.5 0 0 0-1.98-3A2.5 2.5 0 0 0 14.5 2Z"/>
      </svg>
    );

    const BookOpen = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
        <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
      </svg>
    );

    const Activity = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>
      </svg>
    );

    const Zap = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
      </svg>
    );

    const User = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
        <circle cx="12" cy="7" r="4"/>
      </svg>
    );

    const AlertCircle = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="12"/>
        <line x1="12" y1="16" x2="12.01" y2="16"/>
      </svg>
    );

    const TrendingUp = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/>
        <polyline points="17 6 23 6 23 12"/>
      </svg>
    );

    const Sliders = ({ className, size = 24 }) => (
      <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none"
        stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
        <line x1="4"  y1="21" x2="4"  y2="14"/>
        <line x1="4"  y1="10" x2="4"  y2="3"/>
        <line x1="12" y1="21" x2="12" y2="12"/>
        <line x1="12" y1="8"  x2="12" y2="3"/>
        <line x1="20" y1="21" x2="20" y2="16"/>
        <line x1="20" y1="12" x2="20" y2="3"/>
        <line x1="1"  y1="14" x2="7"  y2="14"/>
        <line x1="9"  y1="8"  x2="15" y2="8"/>
        <line x1="17" y1="16" x2="23" y2="16"/>
      </svg>
    );

    const StarIcon = ({ className }) => (
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
        strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
      </svg>
    );

    /* ── Main App ── */
    const App = () => {
      const [activeTab, setActiveTab]     = useState('overview');
      const [selectedTask, setSelectedTask] = useState(null);
      const [stressLevel, setStressLevel] = useState(0);

      const sections = [
        { id: 'overview',    title: 'The Memory Map',        icon: <BookOpen  className="w-5 h-5" /> },
        { id: 'hm-case',     title: 'The H.M. Trials',       icon: <User      className="w-5 h-5" /> },
        { id: 'tug-of-war',  title: 'The Neural Tug-of-War', icon: <Activity  className="w-5 h-5" /> },
        { id: 'engram-lab',  title: 'Engram Lab',             icon: <Zap      className="w-5 h-5" /> },
      ];

      const hmTasks = [
        {
          id: 'mirror',
          name: 'Mirror Tracing Task',
          type: 'Procedural Memory',
          status: 'SUCCESS',
          description: 'H.M. had to trace a star while looking only at its reflection. He improved every day, despite never remembering he had ever seen the star before.',
          learningCurve: [100, 45, 20, 15, 12],
          outcome: 'Proved motor learning lives outside the hippocampus.'
        },
        {
          id: 'face-name',
          name: 'Face-Name Association',
          type: 'Declarative Memory',
          status: 'FAILURE',
          description: "H.M. could meet a researcher hundreds of times, but every meeting felt like the first time. He could not link a face to a name for more than 30 seconds.",
          learningCurve: [100, 100, 100, 100, 100],
          outcome: 'Proved the MTL is the gateway to "facts" and "people."'
        },
        {
          id: 'digit-span',
          name: 'Digit Span Test',
          type: 'Working Memory',
          status: 'SUCCESS',
          description: "If you gave H.M. a phone number, he could keep it in his head as long as he wasn't interrupted. If he sneezed or someone spoke, the number vanished.",
          learningCurve: [10, 10, 10, 10, 10],
          outcome: 'Proved the PFC can hold data without the Hippocampus.'
        }
      ];

      return (
        <div className="min-h-screen bg-[#0f172a] text-slate-200 font-sans selection:bg-blue-500 selection:text-white">

          {/* Back link */}
          <div className="max-w-6xl mx-auto px-4 pt-4">
            <a href="../../lecture-07/index.html" className="back-link">
              &#8592; Back to Lecture 7
            </a>
          </div>

          {/* Nav */}
          <nav className="bg-[#1e293b]/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-50 mt-3">
            <div className="max-w-6xl mx-auto px-4">
              <div className="flex justify-between items-center h-16">
                <div className="flex items-center gap-3">
                  <div className="p-2 bg-blue-600 rounded-lg shadow-lg shadow-blue-900/20">
                    <Brain className="text-white w-6 h-6" />
                  </div>
                  <span className="font-bold text-xl tracking-tight text-white">
                    NeuroArchive <span className="text-blue-400 font-light">Memory</span>
                  </span>
                </div>
                <div className="hidden md:flex space-x-1">
                  {sections.map((s) => (
                    <button
                      key={s.id}
                      onClick={() => setActiveTab(s.id)}
                      className={`px-4 py-2 rounded-full text-sm font-semibold transition-all duration-300 ${
                        activeTab === s.id
                          ? 'bg-blue-600 text-white shadow-lg shadow-blue-900/40'
                          : 'text-slate-400 hover:text-white hover:bg-slate-800'
                      }`}
                    >
                      {s.title}
                    </button>
                  ))}
                </div>
                {/* Mobile nav */}
                <div className="flex md:hidden">
                  <select
                    value={activeTab}
                    onChange={(e) => setActiveTab(e.target.value)}
                    className="bg-slate-800 text-slate-200 text-sm rounded-lg border border-slate-700 px-2 py-1"
                  >
                    {sections.map((s) => (
                      <option key={s.id} value={s.id}>{s.title}</option>
                    ))}
                  </select>
                </div>
              </div>
            </div>
          </nav>

          <main className="max-w-6xl mx-auto px-4 py-12">

            {/* ── Overview ── */}
            {activeTab === 'overview' && (
              <div className="animate-in fade-in zoom-in-95 duration-700">
                <div className="text-center mb-16 space-y-4">
                  <h1 className="text-5xl font-black text-white tracking-tighter">THE DUALITY OF REMEMBERING</h1>
                  <p className="text-xl text-slate-400 max-w-2xl mx-auto font-light">
                    Explore the biological divide between{' '}
                    <span className="text-blue-400 font-bold italic">knowing who</span> and{' '}
                    <span className="text-green-400 font-bold italic">knowing how</span>.
                  </p>
                </div>

                <div className="grid md:grid-cols-2 gap-8">
                  <div
                    className="group bg-[#1e293b] p-8 rounded-[2rem] border border-slate-700 hover:border-blue-500/50 transition-all cursor-pointer shadow-xl"
                    onClick={() => setActiveTab('hm-case')}
                  >
                    <div className="w-16 h-16 bg-blue-500/10 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                      <BookOpen className="text-blue-400 w-8 h-8" />
                    </div>
                    <h3 className="text-2xl font-bold text-white mb-2 underline decoration-blue-500 decoration-2 underline-offset-4">Explicit Memory</h3>
                    <p className="text-slate-400 leading-relaxed">
                      The world of faces, names, and life events. Powered by the <strong>Hippocampus</strong>. This is what Patient H.M. lost forever.
                    </p>
                  </div>

                  <div
                    className="group bg-[#1e293b] p-8 rounded-[2rem] border border-slate-700 hover:border-green-500/50 transition-all cursor-pointer shadow-xl"
                    onClick={() => setActiveTab('tug-of-war')}
                  >
                    <div className="w-16 h-16 bg-green-500/10 rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform">
                      <Activity className="text-green-400 w-8 h-8" />
                    </div>
                    <h3 className="text-2xl font-bold text-white mb-2 underline decoration-green-500 decoration-2 underline-offset-4">Implicit Memory</h3>
                    <p className="text-slate-400 leading-relaxed">
                      The world of skills, habits, and intuition. Powered by the <strong>Striatum</strong>. This system remained perfectly intact in H.M.
                    </p>
                  </div>
                </div>
              </div>
            )}

            {/* ── H.M. Trials ── */}
            {activeTab === 'hm-case' && (
              <div className="space-y-8 animate-in slide-in-from-right-4 duration-500">
                <div className="flex items-center justify-between border-b border-slate-800 pb-6">
                  <div>
                    <h2 className="text-3xl font-black text-white italic">THE H.M. TRIALS</h2>
                    <p className="text-slate-400">Interact with the tasks that redefined neuroscience.</p>
                  </div>
                  <User className="text-slate-700 w-12 h-12" />
                </div>

                <div className="grid lg:grid-cols-3 gap-6">
                  {hmTasks.map((task) => (
                    <div
                      key={task.id}
                      onClick={() => setSelectedTask(selectedTask?.id === task.id ? null : task)}
                      className={`p-6 rounded-2xl border transition-all cursor-pointer relative overflow-hidden ${
                        selectedTask?.id === task.id
                          ? 'bg-blue-600 border-blue-400 shadow-2xl'
                          : 'bg-slate-800 border-slate-700 hover:bg-[#263348]'
                      }`}
                    >
                      <div className="flex justify-between items-start mb-4">
                        <span className={`px-2 py-1 rounded text-[10px] font-black uppercase tracking-widest ${
                          task.status === 'SUCCESS' ? 'bg-green-500 text-green-950' : 'bg-red-500 text-red-950'
                        }`}>
                          {task.status}
                        </span>
                      </div>
                      <h3 className="text-xl font-bold text-white mb-1">{task.name}</h3>
                      <p className="text-xs font-medium text-slate-400 mb-4 uppercase tracking-tighter">{task.type}</p>
                      <div className="flex items-end gap-1 h-8">
                        {task.learningCurve.map((val, i) => (
                          <div
                            key={i}
                            className={`flex-1 rounded-t ${selectedTask?.id === task.id ? 'bg-white/40' : 'bg-blue-500/30'}`}
                            style={{ height: `${val}%` }}
                          />
                        ))}
                      </div>
                    </div>
                  ))}
                </div>

                {selectedTask && (
                  <div className="bg-slate-800/50 border border-blue-500/30 rounded-[2.5rem] p-10 flex flex-col md:flex-row gap-10 animate-in zoom-in-95">
                    <div className="md:w-1/2 space-y-6">
                      <h3 className="text-4xl font-black text-white">{selectedTask.name}</h3>
                      <p className="text-xl text-slate-300 leading-relaxed">{selectedTask.description}</p>
                      <div className="bg-blue-900/20 p-6 rounded-2xl border border-blue-500/20">
                        <h4 className="text-blue-400 font-black text-sm uppercase tracking-widest mb-2 flex items-center gap-2">
                          <AlertCircle size={16} /> Conclusion
                        </h4>
                        <p className="text-white font-medium italic">"{selectedTask.outcome}"</p>
                      </div>
                    </div>
                    <div className="md:w-1/2 bg-[#0f172a] rounded-3xl p-8 flex items-center justify-center relative overflow-hidden border border-slate-700 shadow-inner">
                      {selectedTask.id === 'mirror' && (
                        <div className="text-center">
                          <div className="w-48 h-48 border-2 border-dashed border-blue-500/50 rounded-full flex items-center justify-center spin-slow">
                            <StarIcon className="text-blue-500 w-24 h-24" />
                          </div>
                          <p className="mt-6 text-sm text-slate-500 uppercase font-black">Procedural Acquisition Visualized</p>
                        </div>
                      )}
                      {selectedTask.id === 'face-name' && (
                        <div className="space-y-4 w-full">
                          <div className="h-4 bg-slate-800 rounded-full overflow-hidden border border-slate-700">
                            <div className="h-full bg-red-500 memory-fade-anim" style={{ width: '100%' }} />
                          </div>
                          <p className="text-center text-red-500 font-black text-sm">MEMORY BUFFER EXPIRING...</p>
                        </div>
                      )}
                      {selectedTask.id === 'digit-span' && (
                        <div className="flex gap-4 flex-wrap justify-center">
                          {[5, 2, 9, 1, 4].map((n, i) => (
                            <div
                              key={i}
                              className="w-12 h-12 bg-blue-600 rounded-xl flex items-center justify-center text-white text-2xl font-black shadow-lg animate-bounce"
                              style={{ animationDelay: `${i * 100}ms` }}
                            >
                              {n}
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            )}

            {/* ── Tug-of-War ── */}
            {activeTab === 'tug-of-war' && (
              <div className="space-y-12 animate-in fade-in duration-500">
                <div className="text-center max-w-2xl mx-auto space-y-4">
                  <h2 className="text-4xl font-black text-white italic tracking-tight">THE BALANCE OF CONTROL</h2>
                  <p className="text-slate-400">
                    The brain is a tug-of-war. Your <strong>Hippocampus</strong> wants to solve problems with logic;
                    your <strong>Striatum</strong> wants to follow habits.
                  </p>
                </div>

                <div className="bg-slate-800 p-10 rounded-[3rem] border border-slate-700 shadow-2xl space-y-12">
                  <div className="space-y-6">
                    <div className="flex justify-between items-end">
                      <div className={`transition-all duration-500 ${stressLevel > 50 ? 'opacity-30 blur-sm' : 'opacity-100'}`}>
                        <h4 className="text-blue-400 font-black mb-1">COGNITIVE SYSTEM</h4>
                        <p className="text-white text-lg font-bold">Hippocampus</p>
                      </div>
                      <div className={`text-right transition-all duration-500 ${stressLevel < 50 ? 'opacity-30 blur-sm' : 'opacity-100'}`}>
                        <h4 className="text-green-400 font-black mb-1">HABIT SYSTEM</h4>
                        <p className="text-white text-lg font-bold">Striatum</p>
                      </div>
                    </div>

                    <div className="relative pt-10">
                      <input
                        type="range"
                        min="0"
                        max="100"
                        value={stressLevel}
                        onChange={(e) => setStressLevel(Number(e.target.value))}
                        className="w-full h-4 bg-slate-900 rounded-full appearance-none cursor-pointer accent-blue-500 border border-slate-700"
                      />
                      <div className="absolute top-0 left-1/2 -translate-x-1/2 flex flex-col items-center">
                        <span className="text-[10px] font-black text-slate-500 mb-1">AMYGDALA STRESS ACTIVATION</span>
                        <Sliders
                          className={`transition-colors ${stressLevel > 60 ? 'text-red-500 animate-pulse' : 'text-slate-600'}`}
                          size={20}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="grid md:grid-cols-2 gap-10">
                    <div className={`p-8 rounded-3xl transition-all duration-500 border ${
                      stressLevel < 60 ? 'bg-blue-600/10 border-blue-500/50' : 'bg-slate-900/50 border-slate-800'
                    }`}>
                      <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                        <Brain className="text-blue-400" /> Flexible Strategy
                      </h3>
                      <p className="text-slate-400">
                        When calm, the Hippocampus leads. You navigate using a "Cognitive Map" (Tolman, 1948).
                        You can find detours and plan new routes.
                      </p>
                    </div>
                    <div className={`p-8 rounded-3xl transition-all duration-500 border ${
                      stressLevel >= 60
                        ? 'bg-green-600/10 border-green-500/50 shadow-[0_0_30px_rgba(34,197,94,0.1)]'
                        : 'bg-slate-900/50 border-slate-800'
                    }`}>
                      <h3 className="text-xl font-bold text-white mb-4 flex items-center gap-2">
                        <TrendingUp className="text-green-400" /> Rigid Habit
                      </h3>
                      <p className="text-slate-400">
                        Under stress, the Amygdala shuts down the hippocampus and lets the Striatum take over.
                        You fall back on "S-R" (Stimulus-Response) behaviors. You act on autopilot.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* ── Engram Lab ── */}
            {activeTab === 'engram-lab' && (
              <div className="animate-in zoom-in-95 duration-500 space-y-8">
                <div className="bg-[#020617] p-12 rounded-[3rem] border border-slate-800 relative overflow-hidden">
                  <div className="absolute top-0 right-0 p-10 text-blue-500/5">
                    <Zap size={400} />
                  </div>
                  <div className="relative z-10 space-y-8">
                    <div className="space-y-4">
                      <h2 className="text-4xl font-black text-white tracking-tight">ENGRAM CONNECTIVITY</h2>
                      <p className="text-slate-400 text-xl max-w-2xl">
                        Modern science (Josselyn &amp; Tonegawa, 2020) suggests memories are populations of neurons linked by shared activity.
                      </p>
                    </div>

                    <div className="flex flex-wrap gap-8 justify-center py-10">
                      <div className="flex flex-col items-center gap-4">
                        <div className="w-32 h-32 rounded-full bg-blue-500/20 border-4 border-blue-500 flex items-center justify-center relative">
                          <div className="absolute inset-0 bg-blue-500 blur-xl opacity-20 animate-pulse" />
                          <Activity className="text-blue-500 w-12 h-12" />
                        </div>
                        <span className="font-bold text-blue-400">Active Engram</span>
                        <p className="text-xs text-center text-slate-500 max-w-[120px]">High excitability, easily recalled.</p>
                      </div>

                      <div className="h-[2px] w-20 bg-slate-800 self-center" />

                      <div className="flex flex-col items-center gap-4">
                        <div className="w-32 h-32 rounded-full bg-slate-800 border-4 border-slate-700 flex items-center justify-center relative">
                          <Zap className="text-slate-600 w-12 h-12" />
                        </div>
                        <span className="font-bold text-slate-500">Silent Engram</span>
                        <p className="text-xs text-center text-slate-500 max-w-[120px]">Memory exists but lacks the "key" to unlock.</p>
                      </div>
                    </div>

                    <div className="bg-slate-900/80 p-8 rounded-3xl border border-slate-800">
                      <h4 className="font-black text-white text-lg mb-2">The Predictive Power</h4>
                      <p className="text-slate-400">
                        According to the <strong>Predictive Map</strong> hypothesis (Stachenfeld, 2017),
                        your engrams aren't just snapshots of what happened — they are simulations of what <em>will</em> happen next.
                      </p>
                    </div>
                  </div>
                </div>
              </div>
            )}

          </main>

          <footer className="py-20 border-t border-slate-800">
